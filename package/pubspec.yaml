name: my_stt_recorder
description: Android-first single-capture WAV recorder with platform speech recognition events.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  plugin:
    platforms:
      android:
        package: com.redhun.my_stt_recorder
        pluginClass: MySttRecorderPlugin
